<title>Checklist de Veículo — ILED</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#0a0c10;color:#e8eaed;font-size:15px;line-height:1.4}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:12px;border-bottom:3px solid #e10600;padding:14px 0;margin-bottom:16px}
.top .logo{font-weight:800;font-size:20px;letter-spacing:.06em}
.top .logo b{color:#e10600}
.top .sub{font-size:12px;color:#8a909c}
h2{font-size:15px;color:#ff5a5a;text-transform:uppercase;letter-spacing:.04em;margin:22px 0 10px}
.card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:#9aa0ac;margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
input,select,textarea{width:100%;background:#12151b;border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:11px;color:#e8eaed;font-size:15px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#e10600}
textarea{resize:vertical}
.field{margin-bottom:12px}
.item{border-bottom:1px solid rgba(255,255,255,.06);padding:11px 0}
.item:last-child{border-bottom:none}
.item .nome{font-weight:600;margin-bottom:8px}
.opts{display:flex;gap:6px;margin-bottom:7px}
.opt{flex:1;text-align:center;padding:9px 0;border-radius:8px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);font-weight:700;font-size:13px;cursor:pointer;user-select:none}
.opt.ok.on{background:#1a7f43;border-color:#1a7f43;color:#fff}
.opt.falha.on{background:#b00500;border-color:#b00500;color:#fff}
.opt.na.on{background:#555b66;border-color:#555b66;color:#fff}
.item .obs{font-size:13px;padding:8px}
.estado{display:flex;gap:8px}
.estado .eb{flex:1;text-align:center;padding:12px 0;border-radius:9px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);font-weight:700;cursor:pointer}
.estado .eb.bom.on{background:#1a7f43;border-color:#1a7f43;color:#fff}
.estado .eb.medio.on{background:#b8860b;border-color:#b8860b;color:#fff}
.estado .eb.ruim.on{background:#b00500;border-color:#b00500;color:#fff}
.areas{display:flex;flex-wrap:wrap;gap:7px}
.area{padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);font-size:13px;cursor:pointer}
.area.on{background:rgba(225,6,0,.2);border-color:#e10600;color:#ff8080}
.btn{width:100%;padding:15px;border:none;border-radius:11px;font-weight:800;font-size:16px;cursor:pointer;background:#e10600;color:#fff;margin-top:8px}
.btn:disabled{opacity:.5}
.btn.sec{background:rgba(255,255,255,.08);color:#e8eaed}
.msg{padding:12px;border-radius:9px;margin:12px 0;font-size:14px;text-align:center}
.msg.ok{background:rgba(26,127,67,.18);border:1px solid rgba(26,127,67,.5);color:#7fe0a8}
.msg.err{background:rgba(176,5,0,.18);border:1px solid rgba(176,5,0,.5);color:#ff9a9a}
.done{text-align:center;padding:40px 20px}
.done .ico{font-size:56px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>

var GRUPOS=[
  {g:'Luzes Traseiras', itens:['Da placa','Direita — Luz','Direita — Luz de ré','Direita — Luz de freio','Direita — Luz de seta','Esquerda — Luz','Esquerda — Luz de ré','Esquerda — Luz de freio','Esquerda — Luz de seta']},
  {g:'Luzes Dianteiras', itens:['Da placa','Direita — Farol alto','Direita — Farol baixo','Direita — Seta','Direita — Luz de neblina','Esquerda — Farol baixo','Esquerda — Farol alto','Esquerda — Seta','Esquerda — Luz neblina']},
  {g:'Segurança', itens:['CRLV válida','Buzina','Chave de roda','Cintos','Tacógrafo na validade','Extintor','Limpadores','Macaco','Painel','Retrovisor interno','Retrovisor direito','Retrovisor esquerdo','Vazamentos visíveis','Triângulo','Pneus']},
  {g:'Motor', itens:['Óleo de motor','Água do limpador','Água do radiador','Embreagem','Sistema de freio','Freio de mão','Óleo de freio']},
  {g:'Baú', itens:['Baú limpo','Cintas organizadas','Rampa amarrada','Iluminação do baú']}
]
var ESTADO_ITENS=['Lataria','Pintura','Vidros','Bancos','Painel interno','Pneus (desgaste)']
var AREAS=['Frente','Traseira','Lateral direita','Lateral esquerda','Teto','Baú']
function key(g,it){return g+'|'+it}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

var C={data:new Date().toISOString().slice(0,10),demanda:'',veiculo:'',placa:'',motorista:'',km:'',estado:{},itens:{},areas:[],observacoes:'',foto:null}
var VEICULOS=[]
var SALVO=false

function carregaVeiculos(){
  render()  // desenha o formulário JÁ, sem esperar o banco
  if(!initSB()){
    // tenta de novo por até ~4s (caso o script do CDN ainda esteja carregando)
    var tent=0
    var iv=setInterval(function(){
      tent++
      if(initSB()){ clearInterval(iv); buscaVeiculos() }
      else if(tent>=20){ clearInterval(iv) }  // desiste; motorista digita a placa manual
    },200)
    return
  }
  buscaVeiculos()
}
function buscaVeiculos(){
  if(!sb) return
  try{
    sb.from('frota_veiculos').select('*').then(function(res){
      if(res && res.data && res.data.length){ VEICULOS=res.data; render() }
    })
  }catch(e){}
}
function render(){
  if(SALVO){ document.getElementById('app').innerHTML=
    '<div class="done"><div class="ico">✅</div><h2 style="color:#7fe0a8;border:none">Checklist enviado!</h2>'+
    '<p style="color:#9aa0ac">Obrigado. O checklist do veículo <b>'+esc(C.placa)+'</b> foi salvo no sistema ILED.</p>'+
    '<button class="btn sec" onclick="novoOutro()">Preencher outro veículo</button></div>'
    return }
  var vopts='<option value="">— selecione o veículo —</option>'+VEICULOS.map(function(v){
    return '<option value="'+esc(v.placa)+'|'+esc(v.veiculo||'')+'"'+((C.placa===v.placa)?' selected':'')+'>'+esc(v.placa)+' · '+esc(v.veiculo||'')+'</option>'
  }).join('')
  var ident='<div class="card">'+
    '<div class="field"><label>Veículo</label><select id="f_vei" onchange="selVei(this.value)">'+vopts+'</select></div>'+
    (VEICULOS.length?'':'<div class="field"><label>Placa</label><input id="f_placa" value="'+esc(C.placa)+'" oninput="C.placa=this.value" placeholder="ABC1D23"></div>')+
    '<div class="grid2"><div class="field"><label>Data</label><input type="date" value="'+esc(C.data)+'" oninput="C.data=this.value"></div>'+
    '<div class="field"><label>KM atual</label><input type="number" value="'+esc(C.km)+'" oninput="C.km=this.value" placeholder="000000"></div></div>'+
    '<div class="field"><label>Motorista</label><input value="'+esc(C.motorista)+'" oninput="C.motorista=this.value" placeholder="Seu nome"></div>'+
    '<div class="field"><label>Demanda / Evento (opcional)</label><input value="'+esc(C.demanda)+'" oninput="C.demanda=this.value" placeholder="Ex.: Rock in Rio"></div>'+
    '<div class="field"><label>Foto do veículo (opcional)</label>'+
      (C.foto
        ? '<img src="'+C.foto+'" style="width:100%;border-radius:9px;border:1px solid rgba(255,255,255,.12);display:block"><button class="btn sec" style="margin-top:8px" onclick="removeFoto()">🗑 Remover foto</button>'
        : '<button class="btn sec" onclick="abrirCamera()">📷 Tirar / escolher foto</button>')+
      '<input id="f_foto" type="file" accept="image/*" capture="environment" style="display:none" onchange="setFoto(this)">'+
    '</div>'+
    '</div>'
  // estado geral
  var estado='<h2>Estado geral</h2><div class="card">'+ESTADO_ITENS.map(function(it){
    function eb(v,lbl){return '<div class="eb '+v+(C.estado[it]===v?' on':'')+'" onclick="setEstado(\''+esc(it).replace(/'/g,"\\'")+'\',\''+v+'\')">'+lbl+'</div>'}
    return '<div style="margin-bottom:12px"><div style="font-weight:600;margin-bottom:6px">'+esc(it)+'</div><div class="estado">'+eb('bom','Bom')+eb('medio','Médio')+eb('ruim','Ruim')+'</div></div>'
  }).join('')+'</div>'
  // áreas afetadas
  var areas='<h2>Áreas afetadas</h2><div class="card"><div class="areas">'+AREAS.map(function(a){
    return '<div class="area'+(C.areas.indexOf(a)>=0?' on':'')+'" onclick="toggleArea(\''+esc(a).replace(/'/g,"\\'")+'\')">'+esc(a)+'</div>'
  }).join('')+'</div></div>'
  // grupos de itens
  var grupos=GRUPOS.map(function(gr){
    return '<h2>'+esc(gr.g)+'</h2><div class="card">'+gr.itens.map(function(it){
      var k=key(gr.g,it); var resp=C.itens[k]||{r:'',obs:''}
      function op(v,lbl){return '<div class="opt '+v+(resp.r===v?' on':'')+'" onclick="setResp(\''+esc(k).replace(/'/g,"\\'")+'\',\''+v+'\')">'+lbl+'</div>'}
      return '<div class="item"><div class="nome">'+esc(it)+'</div>'+
        '<div class="opts">'+op('ok','OK')+op('falha','Falha')+op('na','N/A')+'</div>'+
        '<input class="obs" value="'+esc(resp.obs)+'" oninput="setObs(\''+esc(k).replace(/'/g,"\\'")+'\',this.value)" placeholder="Observação (opcional)"></div>'
    }).join('')+'</div>'
  }).join('')
  var obs='<h2>Observações gerais</h2><div class="card"><textarea rows="3" oninput="C.observacoes=this.value" placeholder="Anotações do motorista">'+esc(C.observacoes)+'</textarea></div>'
  var msg='<div id="msg"></div>'
  var btn='<button class="btn" onclick="salvar()">💾 Enviar checklist</button>'
  document.getElementById('app').innerHTML=ident+estado+areas+grupos+obs+msg+btn
}
function selVei(v){ if(!v){C.placa='';C.veiculo='';return} var p=v.split('|'); C.placa=p[0]; C.veiculo=p[1]||'' }
function setEstado(it,v){ C.estado[it]=(C.estado[it]===v?'':v); render() }
function toggleArea(a){ var i=C.areas.indexOf(a); if(i>=0)C.areas.splice(i,1); else C.areas.push(a); render() }
function setResp(k,v){ var cur=C.itens[k]||{r:'',obs:''}; cur.r=(cur.r===v?'':v); C.itens[k]=cur; render() }
function setObs(k,val){ var cur=C.itens[k]||{r:'',obs:''}; cur.obs=val; C.itens[k]=cur }
function contaAtencao(){ var n=0; for(var k in C.itens){ if(C.itens[k]&&C.itens[k].r==='falha')n++ } return n }
function novoOutro(){ C={data:new Date().toISOString().slice(0,10),demanda:'',veiculo:'',placa:'',motorista:'',km:'',estado:{},itens:{},areas:[],observacoes:'',foto:null}; SALVO=false; render() }
function abrirCamera(){ var el=document.getElementById('f_foto'); if(el)el.click() }
function removeFoto(){ C.foto=null; render() }
function setFoto(input){
  var f=input.files&&input.files[0]; if(!f)return
  var reader=new FileReader()
  reader.onload=function(ev){
    var img=new Image()
    img.onload=function(){
      var maxDim=1200, w=img.width, h=img.height
      if(w>=h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim } }
      else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim } }
      try{
        var cv=document.createElement('canvas'); cv.width=w; cv.height=h
        var ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,w,h)
        C.foto=cv.toDataURL('image/jpeg',0.7)
      }catch(e){ C.foto=ev.target.result }
      render()
    }
    img.onerror=function(){ C.foto=ev.target.result; render() }
    img.src=ev.target.result
  }
  reader.readAsDataURL(f)
}
function salvar(){
  if(!C.placa){ msgErr('Selecione ou informe a placa do veículo.'); return }
  if(!C.motorista){ msgErr('Informe o nome do motorista.'); return }
  if(!sb){ initSB() }
  if(!sb){ msgErr('Sem conexão com o sistema. Abra pelo link (precisa de internet) e tente de novo.'); return }
  var btn=document.querySelector('.btn'); if(btn){btn.disabled=true;btn.textContent='Enviando…'}
  var payload={data:C.data||null,demanda:C.demanda,veiculo:C.veiculo,placa:C.placa,motorista:C.motorista,km:C.km,
    estado:C.estado,itens:C.itens,areas:C.areas,observacoes:C.observacoes,atencao_qtd:contaAtencao(),foto_url:C.foto||null}
  sb.from('frota_checklists').insert(payload).then(function(res){
    if(res && res.error){ msgErr('Erro ao enviar: '+res.error.message); if(btn){btn.disabled=false;btn.textContent='💾 Enviar checklist'} }
    else { SALVO=true; render() }
  })
}
function msgErr(t){ var m=document.getElementById('msg'); if(m)m.innerHTML='<div class="msg err">'+esc(t)+'</div>'; window.scrollTo(0,document.body.scrollHeight) }
carregaVeiculos()
</script>
</body>
</html>
