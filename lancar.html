<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#0a0c10;color:#e8eaed;font-size:15px;line-height:1.4}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:12px;border-bottom:3px solid #e10600;padding:14px 0;margin-bottom:16px}
.top .sub{font-size:12px;color:#8a909c}
h2{font-size:15px;color:#ff5a5a;text-transform:uppercase;letter-spacing:.04em;margin:22px 0 10px}
.card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:#9aa0ac;margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
input,select,textarea{width:100%;background:#12151b;border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:11px;color:#e8eaed;font-size:15px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#e10600}
textarea{resize:vertical}
.field{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.toggle{display:flex;gap:8px;margin-bottom:14px}
.toggle .tg{flex:1;text-align:center;padding:13px 0;border-radius:10px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);font-weight:700;font-size:14px;cursor:pointer;user-select:none}
.toggle .tg.prod.on{background:#1a7f43;border-color:#1a7f43;color:#fff}
.toggle .tg.just.on{background:#b8860b;border-color:#b8860b;color:#fff}
.seg{display:flex;gap:8px}
.seg .sb{flex:1;text-align:center;padding:11px 0;border-radius:9px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);font-weight:700;cursor:pointer}
.seg .sb.on{background:rgba(225,6,0,.2);border-color:#e10600;color:#ff8080}
.btn{width:100%;padding:15px;border:none;border-radius:11px;font-weight:800;font-size:16px;cursor:pointer;background:#e10600;color:#fff;margin-top:8px}
.btn:disabled{opacity:.5}
.btn.sec{background:rgba(255,255,255,.08);color:#e8eaed}
.msg{padding:12px;border-radius:9px;margin:12px 0;font-size:14px;text-align:center}
.msg.ok{background:rgba(26,127,67,.18);border:1px solid rgba(26,127,67,.5);color:#7fe0a8}
.msg.err{background:rgba(176,5,0,.18);border:1px solid rgba(176,5,0,.5);color:#ff9a9a}
.done{text-align:center;padding:40px 20px}
.done .ico{font-size:56px;margin-bottom:12px}
.hint{font-size:12px;color:#8a909c;margin:-4px 0 12px}
.resumo{background:rgba(55,201,138,.08);border:1px solid rgba(55,201,138,.25);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:6px}
.resumo b{color:#7fe0a8}
</style>

  q_modulos:'',q_pixels:'',q_trilhas:'',q_ci:'',q_mascaras:'',situacao:'RECUPERADO',
  justificativa:'FALTA',observacao:''} }

function msg(t,ok){ return '<div class="msg '+(ok?'ok':'err')+'">'+esc(t)+'</div>' }

function render(){
  var app=document.getElementById('app'); if(!app)return
  if(FEITO){
    app.innerHTML='<div class="done"><div class="ico">✅</div>'+
      '<div style="font-size:19px;font-weight:800;margin-bottom:6px">Produção registrada!</div>'+
      '<div class="hint" style="font-size:14px">Já entrou no sistema do laboratório e conta no ranking e na meta do mês.</div>'+
      '<button class="btn" style="margin-top:20px" onclick="outro()">+ Lançar outro</button></div>'
    return
  }
  var ehProd=C.tipo==='producao'
  var optsTec='<option value="">— selecione seu nome —</option>'+
    TECNICOS.map(function(n){return '<option value="'+esc(n)+'"'+(C.tecnico===n?' selected':'')+'>'+esc(n)+'</option>'}).join('')
  var dlMod=MODELOS.map(function(m){return '<option value="'+esc(m)+'">'}).join('')

  var ident='<div class="card">'+
    '<div class="field"><label>Técnico</label><select onchange="C.tecnico=this.value">'+optsTec+'</select></div>'+
    '<div class="field"><label>Data da produção</label><input type="date" value="'+esc(C.data)+'" onchange="C.data=this.value"></div>'+
    '</div>'

  var toggle='<div class="toggle">'+
    '<div class="tg prod'+(ehProd?' on':'')+'" onclick="setTipo(\'producao\')">🔧 Produção</div>'+
    '<div class="tg just'+(!ehProd?' on':'')+'" onclick="setTipo(\'justificativa\')">📋 Justificativa</div>'+
    '</div>'

  var corpo
  if(ehProd){
    corpo='<div class="card">'+
      '<div class="field"><label>Modelo</label><input list="mods" value="'+esc(C.modelo)+'" oninput="C.modelo=this.value" placeholder="Ex.: P3.91 / P2.6…"><datalist id="mods">'+dlMod+'</datalist></div>'+
      '<div class="grid2">'+
        '<div class="field"><label>Tipo</label><select onchange="C.tipoItem=this.value">'+TIPOS_ITEM.map(function(t){return '<option'+(C.tipoItem===t?' selected':'')+'>'+t+'</option>'}).join('')+'</select></div>'+
        '<div class="field"><label>Situação</label><select onchange="C.situacao=this.value">'+SITUACOES.map(function(s){return '<option'+(C.situacao===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div>'+
      '</div>'+
      '<div class="grid2">'+
        '<div class="field"><label>Módulos / placas</label><input type="number" inputmode="numeric" value="'+esc(C.q_modulos)+'" oninput="C.q_modulos=this.value" placeholder="0"></div>'+
        '<div class="field"><label>Pixels trocados</label><input type="number" inputmode="numeric" value="'+esc(C.q_pixels)+'" oninput="C.q_pixels=this.value" placeholder="0"></div>'+
      '</div>'+
      '<div class="grid3">'+
        '<div class="field"><label>Trilhas</label><input type="number" inputmode="numeric" value="'+esc(C.q_trilhas)+'" oninput="C.q_trilhas=this.value" placeholder="0"></div>'+
        '<div class="field"><label>CI</label><input type="number" inputmode="numeric" value="'+esc(C.q_ci)+'" oninput="C.q_ci=this.value" placeholder="0"></div>'+
        '<div class="field"><label>Máscaras</label><input type="number" inputmode="numeric" value="'+esc(C.q_mascaras)+'" oninput="C.q_mascaras=this.value" placeholder="0"></div>'+
      '</div>'+
      '<div class="field" style="margin-bottom:0"><label>Observação (opcional)</label><input value="'+esc(C.observacao)+'" oninput="C.observacao=this.value" placeholder="Anotação"></div>'+
    '</div>'
  } else {
    corpo='<div class="card">'+
      '<div class="field"><label>Motivo</label><select onchange="C.justificativa=this.value">'+JUSTIFS.map(function(j){return '<option'+(C.justificativa===j?' selected':'')+'>'+j+'</option>'}).join('')+'</select></div>'+
      '<div class="field" style="margin-bottom:0"><label>Observação (opcional)</label><input value="'+esc(C.observacao)+'" oninput="C.observacao=this.value" placeholder="Detalhe"></div>'+
    '</div>'
  }

  var botao='<button class="btn" '+(ENVIANDO?'disabled':'')+' onclick="enviar()">'+(ENVIANDO?'Enviando…':'📤 Enviar lançamento')+'</button>'
  app.innerHTML=ident+toggle+corpo+(window._erro?msg(window._erro,false):'')+botao
}

function setTipo(t){ C.tipo=t; render() }
function outro(){ var tec=C.tecnico, dt=C.data; C=novo(); C.tecnico=tec; C.data=dt; FEITO=false; window._erro=''; render() }

function enviar(){
  window._erro=''
  if(!C.tecnico){ window._erro='Selecione seu nome.'; render(); return }
  if(!C.data){ window._erro='Informe a data da produção.'; render(); return }
  if(C.tipo==='producao' && !C.modelo.trim()){ window._erro='Informe o modelo.'; render(); return }
  if(!sb && !initSB()){ window._erro='Sem conexão com o banco. Tente de novo.'; render(); return }
  ENVIANDO=true; render()
  var agora=new Date().toISOString()
  var payload
  if(C.tipo==='producao'){
    payload={data:C.data,tecnico:C.tecnico,tipo_registro:'producao',
      lancado_por:C.tecnico,lancado_em:agora,
      modelo:C.modelo.trim(),tipo:C.tipoItem,
      q_modulos:(+C.q_modulos||0),q_pixels:(+C.q_pixels||0),q_trilhas:(+C.q_trilhas||0),
      q_ci:(+C.q_ci||0),q_mascaras:(+C.q_mascaras||0),situacao:C.situacao,
      justificativa:null,observacao:C.observacao||null}
  } else {
    payload={data:C.data,tecnico:C.tecnico,tipo_registro:'justificativa',
      lancado_por:C.tecnico,lancado_em:agora,
      modelo:null,tipo:null,q_modulos:0,q_pixels:0,q_trilhas:0,q_ci:0,q_mascaras:0,
      situacao:null,justificativa:C.justificativa,observacao:C.observacao||null}
  }
  sb.from('lab_producao').insert(payload).then(function(res){
    ENVIANDO=false
    if(res.error){ window._erro='Não salvou: '+res.error.message; render(); return }
    FEITO=true; render()
  }, function(err){ ENVIANDO=false; window._erro='Erro: '+(err&&err.message||err); render() })
}

function carregarListas(){
  if(!sb && !initSB()){ render(); return }
  // técnicos ativos
  sb.from('lab_tecnicos').select('nome,ativo,ordem').then(function(res){
    if(!res.error && res.data){
      TECNICOS=res.data.filter(function(t){return t.ativo!==false})
        .sort(function(a,b){return (a.ordem||0)-(b.ordem||0) || String(a.nome).localeCompare(String(b.nome))})
        .map(function(t){return t.nome})
    }
    render()
  }, function(){ render() })
  // modelos (para o datalist)
  sb.from('lab_modelos').select('modelo').then(function(res){
    if(!res.error && res.data){ MODELOS=res.data.map(function(m){return m.modelo}).filter(Boolean) ; render() }
  }, function(){})
}

function boot(){ initSB(); render(); carregarListas() }
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot()
</script>
</body>
</html>
