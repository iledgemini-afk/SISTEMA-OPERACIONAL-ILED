<style>
:root{
  --bg:#08080a; --txt:#f3f4f7; --mut:#9aa0ac; --dim:#6b7280;
  --red:#e10600; --red2:#ff2b38; --grn:#37c98a; --amber:#f2b53c; --blue:#3d74ff; --cyan:#22c3e6;
  --line:rgba(255,255,255,.075); --glass-bd:rgba(255,255,255,.10);
  --glass-sh:0 8px 32px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.09);
  --panel:rgba(16,16,21,.78); --field:#101015; --fieldbd:rgba(255,255,255,.12);
  --hdr:118px; --ftr:28px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{color-scheme:dark;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;font-size:13px;text-transform:uppercase}
body:before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;z-index:-2;pointer-events:none;
  background:radial-gradient(1100px 600px at 12% -8%,rgba(225,6,0,.14),transparent 60%),radial-gradient(900px 620px at 108% 8%,rgba(61,116,255,.10),transparent 60%),radial-gradient(1200px 800px at 50% 120%,rgba(225,6,0,.06),transparent 55%),linear-gradient(180deg,#08080a,#0a0a0d 60%,#08080a)}
#fx{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;pointer-events:none;opacity:.55}
textarea,.notx{text-transform:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#0b0b0f}
::-webkit-scrollbar-thumb{background:linear-gradient(#e10600,#7a0400);border-radius:8px;border:2px solid #0b0b0f}
::-webkit-scrollbar-thumb:hover{background:#ff2b38}
.subpixel{height:3px;width:100%;background:repeating-linear-gradient(90deg,var(--red) 0 3px,var(--amber) 3px 6px,#f5f5f5 6px 9px,var(--blue) 9px 12px)}
.glass{background:linear-gradient(180deg,rgba(22,22,28,.74),rgba(14,14,18,.66));-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);border:1px solid var(--glass-bd);border-radius:14px;box-shadow:var(--glass-sh)}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)} .ok{color:var(--grn)} .bad{color:var(--red2)} .wa{color:var(--amber)}

/* ---------- topo ---------- */
header.top{position:fixed;top:0;left:0;right:0;z-index:30;background:rgba(8,8,10,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:8px;padding:7px 12px;min-height:58px;flex-wrap:wrap}
.logowrap{position:relative;display:grid;place-items:center;flex:none;cursor:pointer}
.logowrap .glow{position:absolute;width:56px;height:16px;border-radius:12px;filter:blur(16px);animation:cyc 5s linear infinite}
@keyframes cyc{0%{background:#e10600}25%{background:#f2b53c}50%{background:#f5f5f5}75%{background:#3d74ff}100%{background:#e10600}}
.logowrap img{height:40px;position:relative;display:block}
.brand{display:flex;flex-direction:column;line-height:1;margin-right:4px;white-space:nowrap}
.brand b{font-size:19px;letter-spacing:.14em;font-weight:900}
.brand b i{font-style:normal;color:var(--red)}
.brand span{font-size:9px;letter-spacing:.28em;color:var(--mut);margin-top:4px}
.grp{display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}
.grp .lb{font-size:10px;letter-spacing:.16em;color:var(--mut);font-weight:800;margin-right:2px}
.sp{flex:1}
nav.tabs{display:flex;gap:2px;padding:0 10px;overflow-x:auto}
nav.tabs button{background:none;border:none;color:#b9bec8;padding:9px 16px 10px;font:inherit;font-weight:800;letter-spacing:.08em;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button svg{width:17px;height:17px;opacity:.85}
nav.tabs button:hover{color:#fff}
nav.tabs button.on{color:#fff;border-bottom-color:var(--red);background:linear-gradient(180deg,transparent,rgba(225,6,0,.12))}

/* ---------- controles ---------- */
button,.btn{font:inherit;text-transform:uppercase}
.btn svg{width:14px;height:14px;flex:none}
.btn{background:rgba(255,255,255,.07);color:var(--txt);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:6px 11px;font-weight:700;font-size:11.5px;letter-spacing:.04em;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:rgba(255,255,255,.12)}
.btn:disabled{opacity:.4;cursor:default}
.btn.p{background:linear-gradient(180deg,#ff2b38,#c00500);border-color:#ff4a55;color:#fff;box-shadow:0 4px 16px rgba(225,6,0,.35)}
.btn.p:hover{filter:brightness(1.1)}
.btn.on{background:rgba(225,6,0,.22);border-color:rgba(255,60,60,.6);color:#fff}
.btn.g{background:rgba(55,201,138,.14);border-color:rgba(55,201,138,.45);color:#7ee8b8}
.btn.b{background:rgba(61,116,255,.15);border-color:rgba(61,116,255,.5);color:#a9c1ff}
.btn.x{background:rgba(225,6,0,.12);border-color:rgba(225,6,0,.4);color:#ff8a8a}
.btn.sm{padding:4px 8px;font-size:10.5px;border-radius:7px}
.btn.w{width:100%}
.ico{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--txt);border-radius:8px;width:30px;height:30px;display:inline-grid;place-items:center;cursor:pointer;padding:0;flex:none}
.ico:hover{background:rgba(255,255,255,.13)}
.ico.on{background:rgba(61,116,255,.3);border-color:rgba(61,116,255,.7)}
.ico svg{width:16px;height:16px}
input,select,textarea{background:var(--field);color:var(--txt);border:1px solid var(--fieldbd);border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px;min-width:0;text-transform:uppercase}
input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(255,60,60,.7);box-shadow:0 0 0 3px rgba(225,6,0,.16)}
input[type=checkbox]{accent-color:var(--red)}
input[type=range]{accent-color:var(--red);padding:0}
input[type=color]{padding:0;width:34px;height:28px;border-radius:6px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label,.lbl{font-size:10px;letter-spacing:.12em;color:var(--mut);font-weight:800}
.row{display:flex;gap:8px;align-items:flex-end}
.row>.f{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tg{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:11.5px;font-weight:600;letter-spacing:.03em;padding:3px 0;user-select:none}
.sw{position:relative;width:32px;height:18px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:20px;background:#2a2b33;transition:.15s}
.sw i:after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#bfc3cc;transition:.15s}
.sw input:checked+i{background:var(--red)}
.sw input:checked+i:after{left:16px;background:#fff}
.seg{display:inline-flex;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:2px;gap:2px}
.seg button{background:none;border:none;color:#c3c7d0;padding:5px 10px;border-radius:7px;font-weight:800;font-size:11px;cursor:pointer;letter-spacing:.04em}
.seg button.on{background:var(--red);color:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.08);letter-spacing:.04em}
.chip.ok{background:rgba(55,201,138,.16);color:#7ee8b8}
.chip.wa{background:rgba(242,181,60,.16);color:#f7cf7d}
.chip.bad{background:rgba(225,6,0,.2);color:#ff8a8a}
.warn{background:rgba(242,181,60,.1);border:1px solid rgba(242,181,60,.35);color:#f7cf7d;border-radius:9px;padding:8px 10px;font-size:11.5px;line-height:1.45;text-transform:none}
.warn.r{background:rgba(225,6,0,.1);border-color:rgba(225,6,0,.4);color:#ff9b9b}
.hint{font-size:10.5px;color:var(--mut);line-height:1.45;letter-spacing:.02em}

/* ---------- área de trabalho ---------- */
#main{position:fixed;top:var(--hdr);bottom:var(--ftr);left:0;right:0;display:flex;gap:8px;padding:8px}
.pan{width:330px;flex:none;display:flex;flex-direction:column;gap:8px;overflow-y:auto;overflow-x:hidden;padding-right:2px}
.pan.r{width:300px}
.box{padding:11px 12px}
.box h3{margin:0 0 9px;font-size:11px;letter-spacing:.16em;font-weight:900;display:flex;align-items:center;gap:8px}
.box h3 .sp{flex:1}
.box h3 small{font-weight:700;color:var(--mut);letter-spacing:.06em;font-size:10px}
.box+.box{margin-top:0}
.ctr{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.stage{flex:1;position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--glass-bd);background:#050507}
.stage canvas.ws{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block;cursor:default}
.toolbar{display:flex;align-items:center;gap:6px;padding:6px 8px;flex-wrap:wrap}
.toolbar .div{width:1px;height:22px;background:var(--line);margin:0 3px}
.ztxt{min-width:46px;text-align:center;font-weight:800;font-size:12px}
.kv{width:100%;border-collapse:collapse;font-size:11.5px}
.kv td{padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.05)}
.kv td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.kv tr.h td{color:var(--red2);font-weight:900;letter-spacing:.12em;font-size:10px;padding-top:9px}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;text-transform:none}
.term{background:#07080b;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:9px 10px;font-size:11px;line-height:1.55}
.term .p{color:var(--grn)} .term .k{color:#7aa7ff} .term .v{color:#fff;float:right}
table.t{width:100%;border-collapse:collapse;font-size:11.5px}
table.t th{text-align:left;font-size:9.5px;letter-spacing:.12em;color:var(--mut);padding:5px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#111116}
table.t td{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.05)}
table.t td.r,table.t th.r{text-align:right}
.tblw{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.layer{display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.layer:hover{background:rgba(255,255,255,.04)}
.layer.on{background:rgba(225,6,0,.12);border-color:rgba(225,6,0,.4)}
.layer .sw2{width:16px;height:16px;border-radius:4px;flex:none}
.layer .nm{flex:1;min-width:0}
.layer .nm b{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer .nm small{color:var(--mut);font-size:10px}
.layer .ico{width:24px;height:24px}
.layer .ico svg{width:13px;height:13px}
.cores{display:flex;gap:5px;flex-wrap:wrap}
.cores span{width:22px;height:18px;border-radius:4px;cursor:pointer;border:2px solid transparent}
.cores span.on{border-color:#fff}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.presets button{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:5px;cursor:pointer;height:42px}
.presets button.on{background:rgba(225,6,0,.2);border-color:rgba(255,60,60,.7)}
.presets svg{width:100%;height:100%}
.devs{display:flex;gap:8px;overflow-x:auto;padding:6px 8px}
.dev{flex:none;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:6px 8px;background:#0c0d11}
.dev.bad{border-color:rgba(225,6,0,.6)}
.dev .hd{display:flex;justify-content:space-between;gap:12px;font-size:10px;font-weight:800;letter-spacing:.06em;margin-bottom:4px}
.dev .pts{display:grid;grid-auto-flow:column;grid-template-rows:auto auto;gap:3px}
.pt{width:30px;height:26px;border-radius:5px;background:#1b1c22;border:1px solid #2d2f38;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:8.5px;font-weight:800;color:#8a8f99;cursor:pointer;padding-bottom:1px;position:relative}
.pt:before{content:"";position:absolute;top:4px;left:7px;right:7px;height:7px;border-radius:2px;background:repeating-linear-gradient(90deg,#c9a227 0 2px,transparent 2px 3px)}
.pt.u{background:#0f3b25;border-color:#37c98a;color:#bff5dc}
.pt.bk{background:#2b2210;border-color:#f2b53c;color:#ffe2a6}
.pt.act{outline:2px solid #fff}
.pt.opt{width:36px;background:#2a0d0d;border-color:#7a1b1b}
.pt.opt:before{background:#ff6b6b;left:10px;right:10px}
.bar{height:8px;border-radius:6px;background:#1c1d24;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#37c98a,#9be15d)}
.bar i.wa{background:linear-gradient(90deg,#f2b53c,#ffcf6b)} .bar i.bad{background:linear-gradient(90deg,#e10600,#ff5a5a)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kpi{padding:9px 11px}
.kpi .v{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .k{font-size:9.5px;letter-spacing:.12em;color:var(--mut);font-weight:800;margin-top:3px}
.kpi.hero .v{color:var(--red2)}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lib button{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:9px;color:var(--txt);padding:7px 6px;font-size:10.5px;font-weight:700;cursor:pointer;text-align:left;display:flex;align-items:center;gap:6px}
.lib button:hover{background:rgba(255,255,255,.1)}
.lib i{width:9px;height:9px;border-radius:3px;flex:none}
.cardsel{display:grid;gap:6px}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(4,5,8,.72);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .win{width:min(560px,100%);max-height:90vh;overflow:auto;padding:16px}
.modal .win h2{margin:0 0 12px;font-size:14px;letter-spacing:.14em}
footer#status{position:fixed;left:0;right:0;bottom:0;height:var(--ftr);display:flex;align-items:center;gap:16px;padding:0 14px;font-size:10.5px;letter-spacing:.08em;color:var(--mut);border-top:1px solid var(--line);background:rgba(8,8,10,.9);white-space:nowrap;overflow:hidden}
footer#status b{color:#e8eaee;font-weight:800}
footer#status .sep{opacity:.3}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#16171d;border:1px solid rgba(55,201,138,.5);color:#e9fff4;padding:9px 16px;border-radius:10px;font-weight:700;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .2s ease-out}
#toast div.e{border-color:rgba(225,6,0,.6);color:#ffd9d9}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.empty{display:grid;place-items:center;height:100%;color:var(--mut);font-size:12px;letter-spacing:.1em;text-align:center;padding:30px}
.hidden{display:none!important}
.pcp-dw{border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-bottom:6px}
.pcp-dw svg{max-height:560px}
.pcp-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcp-tabs{display:flex;gap:3px;flex-wrap:wrap}
.pcp-tabs button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#c9cdd5;border-radius:8px;padding:5px 10px;font-weight:800;font-size:10.5px;cursor:pointer}
.pcp-tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.scroll{overflow:auto}
.dnode{cursor:move}
.dport{cursor:crosshair}
@media (max-width:1300px){ .pan{width:290px} .pan.r{width:250px} .brand span{display:none} }
.sec{padding:12px 13px}
.sechead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sechead h3{margin:0;font-size:11px;letter-spacing:.16em;font-weight:900}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
.tblwrap table{width:100%;border-collapse:collapse;font-size:11.5px}
.tblwrap th{text-align:left;font-size:9.5px;letter-spacing:.12em;color:var(--mut);padding:5px 7px;border-bottom:1px solid var(--line);background:#111116;position:sticky;top:0}
.tblwrap td{padding:5px 7px;border-bottom:1px solid rgba(255,255,255,.05)}
td.r,th.r{text-align:right}
.mini{font-size:10.5px;color:var(--mut);letter-spacing:.02em}
.chip.gy{background:rgba(255,255,255,.08);color:#c3c7d0}.chip.nt{background:rgba(61,116,255,.18);color:#a9c1ff}
.pcp-form .f{margin-bottom:8px}
.pcp-g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pcp-g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pcp-bts{display:flex;gap:8px;margin-top:6px}.pcp-bts .btn{flex:1}
#pcp_dir>section,#pcp_dir>.kpis,#pcp_dir>.warn{margin-bottom:10px}
</style>

/* ---------------- utilidades ---------------- */
function $(s){ return document.querySelector(s) }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)) }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m] }) }
function pm(v){ var x=parseFloat(String(v==null?'':v).replace(',','.')); return isNaN(x)?0:x }
function fmt(n,d){ if(n==null||isNaN(n)) return '—'; d=d==null?0:d; var s=(+n).toFixed(d), p=s.split('.'); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.'); return p.join(',') }
function fmt2(n){ return fmt(n,2) }
function cl(v,a,b){ return Math.max(a,Math.min(b,v)) }
function uid(){ return Math.random().toString(36).slice(2,9) }
function gcd(a,b){ a=Math.abs(Math.round(a)); b=Math.abs(Math.round(b)); while(b){ var t=b; b=a%b; a=t } return a||1 }
function clone(o){ return JSON.parse(JSON.stringify(o)) }
function hoje(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }
function dataBR(s){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||'')); return m?(m[3]+'/'+m[2]+'/'+m[1]):'' }
function arq(s){ return String(s||'ILED').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9\-_]+/g,'_').replace(/^_+|_+$/g,'').slice(0,50)||'ILED' }
function baixar(blob,nome){ var u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=nome; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(u) },4000) }
function toast(msg,ok){ var h=$('#toast'); if(!h) return; var d=document.createElement('div'); if(ok===false) d.className='e'; d.textContent=msg; h.appendChild(d); setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d) },ok===false?5200:2800) }
function sw(id,on,txt,extra){ return '<label class="tg"><span class="sw"><input type="checkbox" id="'+id+'"'+(on?' checked':'')+(extra||'')+'><i></i></span>'+txt+'</label>' }
function opt(v,t,sel){ return '<option value="'+esc(v)+'"'+(String(v)===String(sel)?' selected':'')+'>'+esc(t)+'</option>' }
function proporcao(w,h){
  if(!(w>0&&h>0)) return {txt:'—',dec:'—',aprox:''}
  var g=gcd(w,h), a=w/g, b=h/g, dec=(w/h)
  var nomes=[[16,9],[4,3],[16,10],[21,9],[32,9],[3,2],[5,4],[1,1],[2,1],[3,1],[4,1],[9,16],[2,3],[3,4]]
  var aprox=''; for(var i=0;i<nomes.length;i++){ if(Math.abs(dec-nomes[i][0]/nomes[i][1])<0.012){ aprox=nomes[i][0]+':'+nomes[i][1]; break } }
  var txt=(a<=64&&b<=64)?(a+':'+b):(aprox||(fmt(dec,2)+':1'))
  return {txt:txt,dec:fmt(dec,2)+' : 1',aprox:aprox,exato:(a<=64&&b<=64)}
}

function capPorta(){ var c=CARD_CAPS.filter(function(x){ return x.id===P.conex.cap })[0]; if(!c||c.id==='cust') return Math.max(1000,+P.conex.capCust||650000); return c.px }
function ativo(T,r,c){ return !T.off[r+'_'+c] }
function calcTela(T){
  var g=T.gab, cols=T.cols, rows=T.rows, n=0
  for(var r=0;r<rows;r++) for(var c=0;c<cols;c++) if(!T.off[r+'_'+c]) n++
  var pxGab=g.resW*g.resH, cap=capPorta(), E=P.energia
  var wPlaca=g.maxW*(cl(+E.brilho||100,1,100)/100)
  var o={g:g,cols:cols,rows:rows,total:cols*rows,n:n,pxGab:pxGab,resW:cols*g.resW,resH:rows*g.resH,
    wM:cols*g.wmm/1000,hM:rows*g.hmm/1000,area:n*g.wmm*g.hmm/1e6,peso:n*g.peso,
    cabsPorPorta:Math.max(1,Math.floor(cap/pxGab)),pxAtivos:n*pxGab,wPlaca:wPlaca,wMax:n*wPlaca,
    pitch:gabPitch(g)}
  o.portasMin=Math.ceil(n/o.cabsPorPorta)
  o.wMed=o.wMax*(pm(E.media)||35)/100
  o.pontos=Math.max(n?2:0,Math.ceil(n/(g.riggingLimit||8)))
  return o
}
/* rotação da tela NO CANVAS (0/90/180/270): o conteúdo sai girado na processadora; a tela física não muda */
function telaDim(T){ var w=T.cols*T.gab.resW, h=T.rows*T.gab.resH; return ((T.rot||0)%180)?{w:h,h:w}:{w:w,h:h} }
function telaXform(ctx,T){ var d=telaDim(T), r=T.rot||0; ctx.translate(T.x,T.y); if(r===90){ ctx.translate(d.w,0); ctx.rotate(Math.PI/2) } else if(r===180){ ctx.translate(d.w,d.h); ctx.rotate(Math.PI) } else if(r===270){ ctx.translate(0,d.h); ctx.rotate(-Math.PI/2) } }
function locParaRaster(T,lx,ly){ var d=telaDim(T), r=T.rot||0, x=lx, y=ly; if(r===90){ x=d.w-ly; y=lx } else if(r===180){ x=d.w-lx; y=d.h-ly } else if(r===270){ x=ly; y=d.h-lx } return {x:T.x+x,y:T.y+y} }
function rasterParaLoc(T,X,Y){ var d=telaDim(T), r=T.rot||0, x=X-T.x, y=Y-T.y; if(r===90) return {x:y,y:d.w-x}; if(r===180) return {x:d.w-x,y:d.h-y}; if(r===270) return {x:d.h-y,y:x}; return {x:x,y:y} }
function cabRaster(T,r,c){ var a=locParaRaster(T,c*T.gab.resW,r*T.gab.resH), b=locParaRaster(T,(c+1)*T.gab.resW,(r+1)*T.gab.resH); return {x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(b.x-a.x),h:Math.abs(b.y-a.y)} }

/* ---------------- ordem de cabeamento (16 presets) ----------------
   inicio TL/TR/BL/BR · orient V (coluna a coluna) / H (linha a linha) · padrao serp (serpentina) / z (mesmo sentido) */
function ordemPlacas(cols,rows,cfg){
  var inicio=cfg.inicio||'TL', orient=cfg.orient||'V', padrao=cfg.padrao||'serp', seq=[]
  var esq=(inicio==='TL'||inicio==='BL'), topo=(inicio==='TL'||inicio==='TR'), i, r, c
  if(orient==='V'){
    for(i=0;i<cols;i++){ c=esq?i:(cols-1-i); var deBaixo=(padrao==='serp')?(topo?(i%2===1):(i%2===0)):!topo
      if(deBaixo){ for(r=rows-1;r>=0;r--) seq.push([r,c]) } else { for(r=0;r<rows;r++) seq.push([r,c]) } }
  } else {
    for(i=0;i<rows;i++){ r=topo?i:(rows-1-i); var daDir=(padrao==='serp')?(esq?(i%2===1):(i%2===0)):!esq
      if(daDir){ for(c=cols-1;c>=0;c--) seq.push([r,c]) } else { for(c=0;c<cols;c++) seq.push([r,c]) } }
  }
  return seq
}
// agrupa a sequência em portas/circuitos. inteiras: não quebra coluna (V) ou linha (H) entre duas portas quando cabe
function agrupaSeq(T,cfg,cap){
  var seq=ordemPlacas(T.cols,T.rows,cfg).filter(function(p){ return !T.off[p[0]+'_'+p[1]] })
  var grupos=[]
  if(cfg.inteiras){
    var linhas=[], cur=null, chave=cfg.orient==='V'?1:0
    seq.forEach(function(p){ if(!cur||cur.k!==p[chave]){ cur={k:p[chave],cells:[]}; linhas.push(cur) } cur.cells.push(p) })
    var g=[]
    linhas.forEach(function(L){
      if(L.cells.length>cap){ if(g.length){ grupos.push(g); g=[] } for(var i=0;i<L.cells.length;i+=cap) grupos.push(L.cells.slice(i,i+cap)); return }
      if(g.length+L.cells.length>cap){ grupos.push(g); g=[] }
      g=g.concat(L.cells) })
    if(g.length) grupos.push(g)
  } else { for(var i=0;i<seq.length;i+=cap) grupos.push(seq.slice(i,i+cap)) }
  return grupos
}
// resultado padronizado: {grupos:[{i,cells:[[r,c]..]}], de:{'r_c':{g,o}}}
function gruposDe(T,camada,cap){
  var S=T[camada], grupos=[]
  if(S.modo!=='manual'){ grupos=agrupaSeq(T,S.cfg,cap).map(function(cells,i){ return {i:i,cells:cells} }) }
  else {
    var por={}
    Object.keys(S.assign).forEach(function(k){ var p=k.split('_'), r=+p[0], c=+p[1]; if(r>=T.rows||c>=T.cols||T.off[k]) return; var g=S.assign[k]; (por[g]=por[g]||[]).push({k:k,r:r,c:c,o:S.seq[k]||0}) })
    grupos=Object.keys(por).map(Number).sort(function(a,b){ return a-b }).map(function(gi){ return {i:gi,cells:por[gi].sort(function(a,b){ return a.o-b.o }).map(function(x){ return [x.r,x.c] })} })
  }
  var de={}; grupos.forEach(function(g,ix){ g.n=ix; g.cells.forEach(function(p,o){ de[p[0]+'_'+p[1]]={g:ix,o:o} }) })
  return {grupos:grupos,de:de}
}
function sigTela(T){ var c=calcTela(T), cap=c.cabsPorPorta, R=gruposDe(T,'sig',cap), lim=capPorta()
  R.grupos.forEach(function(g){ g.px=g.cells.length*c.pxGab; g.pct=g.px/lim; g.over=g.px>lim })
  R.cap=cap; return R }
function capCircuito(T){ var c=calcTela(T), E=P.energia, v=+E.volt||220, fp=+E.fp||0.9
  var porCorrente=Math.max(1,Math.floor((+E.cabo||16)*0.8*v*fp/Math.max(1,c.wPlaca)))
  return Math.max(1,Math.min(T.gab.cabsPerAC||999,porCorrente)) }
function acTela(T){ var c=calcTela(T), cap=capCircuito(T), R=gruposDe(T,'ac',cap), E=P.energia, v=+E.volt||220, fp=+E.fp||0.9, A=+E.cabo||16
  R.grupos.forEach(function(g){ g.w=g.cells.length*c.wPlaca; g.amp=g.w/(v*fp); g.pct=g.amp/(A*0.8); g.over=g.cells.length>(T.gab.cabsPerAC||999)||g.amp>A*0.8 })
  R.cap=cap; return R }

/* ---------------- mapa global de portas → dispositivos ---------------- */
function mapaGlobal(){
  var lista=[]
  P.telas.forEach(function(T,ti){ if(!T.vis) return; var s=sigTela(T); s.grupos.forEach(function(g){ lista.push({ti:ti,g:g.n,cells:g.cells.length,px:g.px,over:g.over,bk:false}) }) })
  var principais=lista.length
  if(P.conex.redund) lista.slice(0,principais).forEach(function(x){ lista.push({ti:x.ti,g:x.g,cells:x.cells,px:x.px,over:x.over,bk:true}) })
  var devs=P.conex.devs.map(function(d,i){ var p=procById(d.m)||PROCESSADORAS[0]; return {i:i,proc:p,cap:p.portas||0,usos:[]} })
  var k=0
  devs.forEach(function(d){ for(var j=0;j<d.cap&&k<lista.length;j++,k++){ lista[k].dev=d.i; lista[k].port=j; d.usos[j]=lista[k] } })
  var falta=lista.length-k
  lista.forEach(function(x){ x.rot=(x.dev!=null)?((x.dev+1)+'.'+(x.port+1)):'—' })
  return {lista:lista,principais:principais,devs:devs,falta:Math.max(0,falta),total:lista.length}
}
function rotPorta(ti,gn,bk){ var M=UI._mg||mapaGlobal(); for(var i=0;i<M.lista.length;i++){ var x=M.lista[i]; if(x.ti===ti&&x.g===gn&&!!x.bk===!!bk) return x.rot } return 'P'+(gn+1) }

/* ---------------- energia geral: circuitos → fases → stecks ---------------- */
function energiaGeral(){
  var E=P.energia, v=+E.volt||220, fp=+E.fp||0.9, nF=E.sistema==='tri'?3:(E.sistema==='bi'?2:1)
  var circ=[], wMax=0, wMed=0, peso=0, n=0
  P.telas.forEach(function(T,ti){ if(!T.vis) return; var c=calcTela(T), a=acTela(T); wMax+=c.wMax; wMed+=c.wMed; peso+=c.peso; n+=c.n
    a.grupos.forEach(function(g){ circ.push({ti:ti,g:g.n,w:g.w,amp:g.amp,cells:g.cells.length,over:g.over}) }) })
  var capF=(+E.steck||32)*(cl(+E.lim||80,10,100)/100)
  var stecks=[]
  function novoSteck(){ var s={i:stecks.length,fases:[],w:0}; for(var f=0;f<nF;f++) s.fases.push({amp:0,w:0,circ:[]}); stecks.push(s); return s }
  circ.forEach(function(ci){
    var s=stecks[stecks.length-1]||novoSteck(), melhor=null
    s.fases.forEach(function(F,fi){ if(F.amp+ci.amp<=capF+1e-9&&(melhor==null||F.amp<s.fases[melhor].amp)) melhor=fi })
    if(melhor==null){ s=novoSteck(); melhor=0 }
    var F=s.fases[melhor]; F.amp+=ci.amp; F.w+=ci.w; F.circ.push(ci); s.w+=ci.w; ci.steck=s.i; ci.fase=melhor })
  var fasesTot=[]; for(var f=0;f<nF;f++) fasesTot.push(0)
  stecks.forEach(function(s){ s.fases.forEach(function(F,fi){ fasesTot[fi]+=F.amp }); s.pct=Math.max.apply(null,s.fases.map(function(F){ return F.amp }))/capF })
  var ampTot=wMax/(v*fp)
  return {v:v,fp:fp,nF:nF,circ:circ,stecks:stecks,capF:capF,wMax:wMax,wMed:wMed,ampTot:ampTot,ampFase:ampTot/nF,fasesTot:fasesTot,
    kvaMax:wMax/fp/1000,kvaMed:wMed/fp/1000,peso:peso,n:n,
    ampPlaca:(n?(wMax/n)/(v*fp):0),maxPlacasSteck:(n?Math.floor(capF/((wMax/n)/(v*fp)))*nF:0)}
}

/* ---------------- totais do projeto ---------------- */
function totais(){
  var t={telas:0,n:0,px:0,peso:0,wMax:0,area:0}
  P.telas.forEach(function(T){ if(!T.vis) return; var c=calcTela(T); t.telas++; t.n+=c.n; t.px+=c.pxAtivos; t.peso+=c.peso; t.wMax+=c.wMax; t.area+=c.area })
  return t
}
function canvasBounds(){
  var x1=0,y1=0
  P.telas.forEach(function(T){ var d=telaDim(T); x1=Math.max(x1,T.x+d.w); y1=Math.max(y1,T.y+d.h) })
  return {w:Math.max(1,x1),h:Math.max(1,y1)}
}
function ajustaCanvas(){ if(P.canvas.auto){ var b=canvasBounds(); P.canvas.w=b.w; P.canvas.h=b.h } }

/* ---------------- histórico (desfazer/refazer) + gravação automática ---------------- */
var Hist={pilha:[],i:-1,timer:null,
  base:function(){ this.pilha=[JSON.stringify(P)]; this.i=0 },
  commit:function(){ var s=JSON.stringify(P); if(this.pilha[this.i]===s) return; this.pilha=this.pilha.slice(0,this.i+1); this.pilha.push(s); if(this.pilha.length>80) this.pilha.shift(); this.i=this.pilha.length-1; Store.agenda() },
  commitLento:function(){ var self=this; clearTimeout(this.timer); this.timer=setTimeout(function(){ self.commit() },500) },
  undo:function(){ if(this.i<=0){ toast('Nada para desfazer',false); return } this.i--; P=JSON.parse(this.pilha[this.i]); App.render(true); Store.agenda() },
  redo:function(){ if(this.i>=this.pilha.length-1) return; this.i++; P=JSON.parse(this.pilha[this.i]); App.render(true); Store.agenda() }
}
var Store={t:null,
  agenda:function(){ clearTimeout(this.t); this.t=setTimeout(function(){ Store.grava() },350) },
  grava:function(){ try{ localStorage.setItem('iledgrid_proj',JSON.stringify(P)) }catch(e){ toast('Navegador sem espaço para o salvamento automático — use SALVAR arquivo',false) } },
  carrega:function(){ try{ var s=localStorage.getItem('iledgrid_proj'); if(s){ var o=JSON.parse(s); if(o&&o.telas) return migra(o) } }catch(e){} return null }
}
function migra(o){ var b=projetoNovo()
  Object.keys(b).forEach(function(k){ if(o[k]===undefined) o[k]=b[k] })
  ;['canvas','exib','conex','energia','sinal','palco'].forEach(function(k){ o[k]=Object.assign({},b[k],o[k]||{}) })
  o.telas.forEach(function(T){ var n=novaTela(); Object.keys(n).forEach(function(k){ if(T[k]===undefined) T[k]=n[k] }); T.sig=Object.assign(n.sig,T.sig); T.ac=Object.assign(n.ac,T.ac); T.p3d=Object.assign(n.p3d,T.p3d); T.logoCfg=Object.assign(n.logoCfg,T.logoCfg||{}) })
  if(!o.telas.length) o.telas=[novaTela()]
  return o }

function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath() }
function txtC(ctx,t,x,y,fs,peso,cor,contorno){ ctx.font=(peso||800)+' '+fs+'px "Segoe UI",system-ui,Arial,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'
  if(contorno){ ctx.lineJoin='round'; ctx.lineWidth=fs*0.12; ctx.strokeStyle=contorno; ctx.strokeText(t,x,y) } ctx.fillStyle=cor||'#fff'; ctx.fillText(t,x,y) }

/* desenha UMA tela. Coordenadas do canvas (1 unidade = 1 px da saída); a tela pode estar girada no canvas.
   o.modo: 'mapa' | 'sig' | 'ac' | 'exp' · o.z: zoom (espessuras) · o.semRot: ignora a rotação (textura 3D) · o.espelho: vista traseira */
function drawTela(ctx,T,ti,o){ ctx.save(); if(o.semRot) ctx.translate(T.x,T.y); else telaXform(ctx,T)
  if(o.espelho){ ctx.translate(T.cols*T.gab.resW,0); ctx.scale(-1,1) }
  drawTelaLocal(ctx,T,ti,o); ctx.restore() }
var DRAW_ESP=false
function txtU(ctx,t,x,y){ if(DRAW_ESP){ ctx.save(); ctx.translate(x,y); ctx.scale(-1,1); ctx.fillText(t,0,0); ctx.restore() } else ctx.fillText(t,x,y) }
function drawTelaLocal(ctx,T,ti,o){
  var g=T.gab, cw=g.resW, ch=g.resH, x0=0, y0=0, W=T.cols*cw, H=T.rows*ch, z=o.z||1, ex=P.exib
  var cor=TELA_CORES[(T.cor||0)%TELA_CORES.length], camada=(o.modo==='sig'||o.modo==='ac')
  var r, c
  for(r=0;r<T.rows;r++) for(c=0;c<T.cols;c++){ if(T.off[r+'_'+c]) continue
    ctx.fillStyle=camada?(((r+c)%2)?'#1d2029':'#171a22'):(((r+c)%2)?cor[0]:cor[1]); ctx.fillRect(x0+c*cw,y0+r*ch,cw,ch) }
  ctx.strokeStyle=camada?'rgba(255,255,255,.07)':'rgba(0,0,0,.28)'; ctx.lineWidth=Math.max(1/z,1)
  ctx.beginPath()
  for(r=0;r<T.rows;r++) for(c=0;c<T.cols;c++){ if(T.off[r+'_'+c]) continue; ctx.rect(x0+c*cw+.5/z,y0+r*ch+.5/z,cw-1/z,ch-1/z) }
  ctx.stroke()
  if(camada) return
  var mn=Math.min(W,H), lw=Math.max(1/z,mn/700), LC=T.logoCfg||{esc:1,x:0,y:0}
  ctx.save(); ctx.beginPath(); ctx.rect(x0,y0,W,H); ctx.clip()
  if(ex.circ){ ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.lineWidth=lw
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x0+W,y0+H); ctx.moveTo(x0+W,y0); ctx.lineTo(x0,y0+H); ctx.stroke()
    ctx.beginPath(); ctx.arc(x0+W/2,y0+H/2,mn/2,0,Math.PI*2); ctx.stroke() }
  if(ex.nums){ var fsN=Math.max(6,Math.min(cw,ch)*0.17), k=0; ctx.font='700 '+fsN+'px system-ui,Arial'; ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillStyle='rgba(255,255,255,.75)'
    for(r=0;r<T.rows;r++) for(c=0;c<T.cols;c++){ if(T.off[r+'_'+c]) continue; k++; ctx.fillText(String(k),x0+c*cw+fsN*0.35,y0+r*ch+fsN*0.3) } }
  var cx=x0+W/2, cy=y0+H/2, yT=cy, fsT=mn*0.16
  if(ex.nome){ var nm=String(T.nome||'').toUpperCase()
    ctx.font='900 '+fsT+'px "Segoe UI",system-ui,Arial,sans-serif'; var tw=ctx.measureText(nm).width; if(tw>W*0.9) fsT*=W*0.9/tw
    yT=cy-mn*(ex.logo?0.13:0.06)
    txtC(ctx,nm,cx,yT,fsT,900,'#fff','rgba(0,0,0,.55)')
    var c0=calcTela(T); pilula(ctx,cx,yT+fsT*0.62+mn*0.04,Math.max(6,fsT*0.34),c0.resW,c0.resH)
    if(T.texto) txtC(ctx,String(T.texto).toUpperCase(),cx,yT-fsT*0.78,fsT*0.3,700,'rgba(255,255,255,.9)','rgba(0,0,0,.5)') }
  if(ex.logo){ var im=logoImg(); if(im.complete&&im.naturalWidth){ var esc2=cl(+LC.esc||1,0.2,4), lh=mn*(ex.nome?0.17:0.3)*esc2, lw2=lh*im.naturalWidth/im.naturalHeight
      var lx=cx-lw2/2+(+LC.x||0)*W, ly=(ex.nome?yT+fsT*0.62+mn*0.12:cy-lh/2)+(+LC.y||0)*H
      if(ex.nome){ ctx.fillStyle='rgba(10,10,12,.85)'; ctx.fillRect(lx-lw2*0.12,ly,lw2*1.24,lh*1.22); ctx.drawImage(im,lx,ly+lh*0.11,lw2,lh) }
      else { ctx.globalAlpha=.9; ctx.drawImage(im,lx,ly,lw2,lh); ctx.globalAlpha=1 } } }
  if(ex.medidas){ var cc=calcTela(T), fsM=Math.max(8/z,mn*0.045)
    ctx.font='800 '+fsM+'px system-ui,Arial'; ctx.fillStyle='rgba(255,255,255,.95)'; ctx.textBaseline='top'; ctx.textAlign='center'
    ctx.fillText(fmtU(cc.wM),cx,y0+fsM*0.4)
    ctx.save(); ctx.translate(x0+fsM*0.4,cy); ctx.rotate(-Math.PI/2); ctx.fillText(fmtU(cc.hM),0,0); ctx.restore() }
  ctx.restore()
}

/* sobreposição de portas (sig) ou circuitos (ac) */
function drawGrupos(ctx,T,ti,R,camada,z,destaque,espelho){ ctx.save(); telaXform(ctx,T); if(espelho){ ctx.translate(T.cols*T.gab.resW,0); ctx.scale(-1,1) } DRAW_ESP=!!espelho
  try{ drawGruposLocal(ctx,T,ti,R,camada,z,destaque) }finally{ DRAW_ESP=false; ctx.restore() } }
function drawGruposLocal(ctx,T,ti,R,camada,z,destaque){
  var g=T.gab, cw=g.resW, ch=g.resH, s=1/z, X=0, Y=0
  R.grupos.forEach(function(G,gi){
    var cor=G.over?'#ff2b38':corPorta(G.i), ativo=(destaque&&G.i===T[camada].ativo)
    ctx.fillStyle=G.over?'rgba(255,43,56,.42)':(cor+(ativo?'90':'5c'))
    G.cells.forEach(function(p){ ctx.fillRect(X+p[1]*cw+1*s,Y+p[0]*ch+1*s,cw-2*s,ch-2*s) })
    if(G.over){ ctx.save(); ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=2*s
      G.cells.forEach(function(p){ var x=X+p[1]*cw, y=Y+p[0]*ch; ctx.beginPath(); ctx.moveTo(x,y+ch); ctx.lineTo(x+cw,y); ctx.stroke() }); ctx.restore() }
    // cabo reserva (redundância): TRUNKS = no mesmo trajeto (feixe) · BESIDE = paralelo, ao lado · MIRROR = espelhado, entra pela ponta final
    var RED=camada==='sig'&&P.conex.redund&&G.cells.length, EST=P.conex.redEstilo||'mirror', AMB='#f2b53c'
    var PTS=G.cells.map(function(p){ return [X+(p[1]+.5)*cw,Y+(p[0]+.5)*ch] })
    if(RED&&EST==='trunks'){ ctx.save(); ctx.strokeStyle=AMB; ctx.globalAlpha=.6; ctx.lineWidth=(ativo?9:7)*s; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.beginPath(); PTS.forEach(function(q,i){ if(i) ctx.lineTo(q[0],q[1]); else ctx.moveTo(q[0],q[1]) }); if(PTS.length===1) ctx.lineTo(PTS[0][0]+.1,PTS[0][1]); ctx.stroke(); ctx.restore() }
    ctx.strokeStyle=ativo?'#fff':cor; ctx.lineWidth=(ativo?3:2)*s; ctx.lineJoin='round'
    ctx.beginPath(); G.cells.forEach(function(p,i){ var x=X+(p[1]+.5)*cw, y=Y+(p[0]+.5)*ch; if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y) }); ctx.stroke()
    ctx.fillStyle=ativo?'#fff':cor
    for(var i=1;i<G.cells.length;i++){ var a=G.cells[i-1], b=G.cells[i], ax=X+(a[1]+.5)*cw, ay=Y+(a[0]+.5)*ch, bx=X+(b[1]+.5)*cw, by=Y+(b[0]+.5)*ch
      var mx=(ax+bx)/2, my=(ay+by)/2, ang=Math.atan2(by-ay,bx-ax), L=7*s
      ctx.beginPath(); ctx.moveTo(mx+Math.cos(ang)*L,my+Math.sin(ang)*L); ctx.lineTo(mx+Math.cos(ang+2.5)*L,my+Math.sin(ang+2.5)*L); ctx.lineTo(mx+Math.cos(ang-2.5)*L,my+Math.sin(ang-2.5)*L); ctx.closePath(); ctx.fill() }
    if(G.cells.length){ var f=G.cells[0], fx=X+(f[1]+.5)*cw, fy=Y+(f[0]+.5)*ch
      var rot=camada==='sig'?rotPorta(ti,G.n,false):('C'+(G.n+1))
      ctx.font='900 '+(10*s)+'px system-ui,Arial'; var tw=ctx.measureText(rot).width, rr=Math.max(9*s,tw/2+5*s)
      ctx.beginPath(); ctx.arc(fx,fy,rr,0,Math.PI*2); ctx.fillStyle='#0b0c10'; ctx.fill(); ctx.lineWidth=2*s; ctx.strokeStyle=cor; ctx.stroke()
      ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle'; txtU(ctx,rot,fx,fy+.5*s)
      if(RED){ var off=Math.min(cw,ch)*0.22
        if(EST!=='trunks'){ // linha tracejada paralela; no MIRROR as setas voltam (o reserva entra pelo último gabinete)
          var Q=PTS.map(function(q){ return [q[0]+off,q[1]+off] }); if(EST==='mirror') Q=Q.slice().reverse()
          ctx.save(); ctx.strokeStyle=AMB; ctx.lineWidth=1.8*s; ctx.setLineDash([6*s,4*s]); ctx.lineJoin='round'; ctx.beginPath(); Q.forEach(function(q,i){ if(i) ctx.lineTo(q[0],q[1]); else ctx.moveTo(q[0],q[1]) }); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle=AMB
          for(var j=1;j<Q.length;j++){ var A=Q[j-1], B=Q[j], mx=(A[0]+B[0])/2, my=(A[1]+B[1])/2, an=Math.atan2(B[1]-A[1],B[0]-A[0]), L2=5*s
            ctx.beginPath(); ctx.moveTo(mx+Math.cos(an)*L2,my+Math.sin(an)*L2); ctx.lineTo(mx+Math.cos(an+2.5)*L2,my+Math.sin(an+2.5)*L2); ctx.lineTo(mx+Math.cos(an-2.5)*L2,my+Math.sin(an-2.5)*L2); ctx.closePath(); ctx.fill() }
          ctx.restore() }
        // etiqueta da porta reserva: no MIRROR fica no último gabinete; no TRUNKS e no BESIDE, ao lado da porta principal
        var pe=EST==='mirror'?PTS[PTS.length-1]:PTS[0], lx=pe[0]+(EST==='mirror'?off:0), ly=pe[1]+(EST==='mirror'?off:rr+11*s)
        var rb=rotPorta(ti,G.n,true); ctx.font='900 '+(9*s)+'px system-ui,Arial'; var tb=ctx.measureText(rb).width
        rrect(ctx,lx-tb/2-5*s,ly-8*s,tb+10*s,16*s,4*s); ctx.fillStyle='#2b2210'; ctx.fill(); ctx.strokeStyle=AMB; ctx.lineWidth=1.5*s; ctx.stroke(); ctx.fillStyle='#ffe2a6'; txtU(ctx,rb,lx,ly+.5*s) }
    }
    if(cw*z>34){ ctx.font='700 '+(9*s)+'px system-ui,Arial'; ctx.fillStyle='rgba(255,255,255,.7)'; ctx.textAlign='center'; ctx.textBaseline='middle'
      G.cells.forEach(function(p,i){ if(i) txtU(ctx,String(i+1),X+(p[1]+1)*cw-8*s,Y+(p[0]+1)*ch-8*s) }) }
  })
}

/* ---- seleção de várias telas (Mapeamento, Conexão e Energia) ----
   UI.msel guarda os ids das telas selecionadas; UI.sel continua sendo a principal (painéis e propriedades). */
function mselM(){ if(!UI.msel) UI.msel={}; return UI.msel }
function mselLista(){ var m=mselM(), o=[]; P.telas.forEach(function(T,i){ if(m[T.id]||i===UI.sel) o.push(i) }); return o }
function mselTem(i){ var T=P.telas[i]; return !!T&&(i===UI.sel||!!mselM()[T.id]) }

function mselToggle(i){ var T=P.telas[i]; if(!T) return; var m=mselM(), cur=P.telas[UI.sel]; if(cur) m[cur.id]=1
  if(m[T.id]&&mselN()>1){ delete m[T.id]; if(i===UI.sel){ for(var j=0;j<P.telas.length;j++) if(m[P.telas[j].id]){ UI.sel=j; break } } }
  else { m[T.id]=1; UI.sel=i } }
function mselTodas(){ var m={}; P.telas.forEach(function(T){ if(T.vis) m[T.id]=1 }); UI.msel=m; if(!m[(P.telas[UI.sel]||{}).id]){ for(var j=0;j<P.telas.length;j++) if(m[P.telas[j].id]){ UI.sel=j; break } } }

function caixaInicio(p,e){ return {tipo:'caixa',x0:p.x,y0:p.y,x1:p.x,y1:p.y,soma:!!(e&&(e.ctrlKey||e.metaKey||e.shiftKey)),base:clone(mselM()),sel0:UI.sel} }

function caixaFim(d){ var x0=Math.min(d.x0,d.x1), x1=Math.max(d.x0,d.x1), y0=Math.min(d.y0,d.y1), y1=Math.max(d.y0,d.y1)
  if((x1-x0)*UI.cv.z<4&&(y1-y0)*UI.cv.z<4){ if(!d.soma) UI.msel={}; return false }   // clique simples no vazio: limpa a seleção
  var m=d.soma?d.base:{}, prim=-1
  if(d.soma&&P.telas[d.sel0]) m[P.telas[d.sel0].id]=1
  P.telas.forEach(function(T,i){ if(!T.vis) return; var c=telaDim(T); if(T.x<x1&&T.x+c.w>x0&&T.y<y1&&T.y+c.h>y0){ m[T.id]=1; if(prim<0) prim=i } })

// 6 · isométrica da estrutura (montantes na frente, travessas atrás)

  function pj(x,y,z){ return [x*Math.cos(AX)+z*Math.cos(AZ), x*Math.sin(AX)-z*Math.sin(AZ)-y] }

  ;[[0,0,0],[C.W,0,0],[0,E.Hs,0],[C.W,E.Hs,0],[0,0,2*E.a],[C.W,E.Hs,2*E.a],[0,E.Hs,2*E.a],[C.W,0,2*E.a]].forEach(function(p){ var q=pj(p[0],p[1],p[2]); mnx=Math.min(mnx,q[0]); mxx=Math.max(mxx,q[0]); mny=Math.min(mny,q[1]); mxy=Math.max(mxy,q[1]) })

  boxes.sort(function(A,B){ return (B.z-A.z)||(A.x-B.x)||((A.t==='M'?0:1)-(B.t==='M'?0:1))||(A.y-B.y) })

    s+='<polygon points="'+P(x2,y1,z1)+' '+P(x2,y1,z2)+' '+P(x2,y2,z2)+' '+P(x2,y2,z1)+'" fill="'+T.metalR+'"'+st+'/>'
    s+='<polygon points="'+P(x1,y2,z1)+' '+P(x2,y2,z1)+' '+P(x2,y2,z2)+' '+P(x1,y2,z2)+'" fill="'+T.metalT+'"'+st+'/>'
    s+='<polygon points="'+P(x1,y1,z1)+' '+P(x2,y1,z1)+' '+P(x2,y2,z1)+' '+P(x1,y2,z1)+'" fill="'+(b.t==='M'?T.metal:T.metalR)+'"'+st+'/>' })
  var pA=P(0,0,0).split(','), pB=P(C.W,0,0).split(','), pC=P(0,E.Hs,0).split(',')

  s+=pcpTxt(+pA[0]-24,(+pA[1]+ +pC[1])/2,pcpM(E.Hs)+' m',{fs:20,c:T.dim,rot:-90})

// 7 · mapa de sinal / energia na vista frontal, com o caminho em serpentina
function pcpSvgMapa(C,T,qual){
  var G=qual==='ac'?C.ac:C.sig, VW=1600, padL=60, padR=60, padT=50, padB=50, k=pcpEscala(C.W,C.H,VW-padL-padR,640)
  var pw=C.W*k, ph=C.H*k, x0=padL+(VW-padL-padR-pw)/2, y0=padT, cw=C.mw*k, ch=C.mh*k, VH=y0+ph+padB, s=''
  s+='<rect x="'+x0.toFixed(1)+'" y="'+y0.toFixed(1)+'" width="'+pw.toFixed(1)+'" height="'+ph.toFixed(1)+'" fill="'+T.painel+'"/>'
  G.grupos.forEach(function(g){ var cor=pcpCor(g.i)
    g.cells.forEach(function(rc,ix){ var x=x0+rc[1]*cw, y=y0+rc[0]*ch
      s+='<rect x="'+(x+0.8).toFixed(1)+'" y="'+(y+0.8).toFixed(1)+'" width="'+(cw-1.6).toFixed(1)+'" height="'+(ch-1.6).toFixed(1)+'" rx="2" fill="'+cor+'" fill-opacity="'+(ix===0?0.95:0.62)+'"/>'
      if(ix===0) s+=pcpTxt(x+cw/2,y+ch/2+5,(qual==='ac'?'C':'P')+(g.i+1),{fs:Math.max(9,Math.min(15,cw*0.36)),c:'#fff',fw:800}) })
    var pts=g.cells.map(function(rc){ return (x0+(rc[1]+0.5)*cw).toFixed(1)+','+(y0+(rc[0]+0.5)*ch).toFixed(1) }).join(' ')
    s+='<polyline points="'+pts+'" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.6" stroke-linejoin="round"/>'
    var p0=g.cells[0]; s+='<circle cx="'+(x0+(p0[1]+0.5)*cw).toFixed(1)+'" cy="'+(y0+(p0[0]+0.82)*ch).toFixed(1)+'" r="'+Math.max(3,Math.min(5,cw*0.12)).toFixed(1)+'" fill="#ffffff"/>' })
  for(var c=0;c<C.cols;c++){ if(cw<14&&(c+1)%5&&c!==0&&c!==C.cols-1) continue; s+=pcpTxt(x0+(c+0.5)*cw,y0+ph+20,String(c+1),{fs:Math.min(13,Math.max(9,cw*0.45)),c:T.mut,fw:600}) }
  s+=pcpTxt(x0,y0-16,'VISTA FRONTAL · ● início da ligação de cada '+(qual==='ac'?'circuito':'porta'),{fs:14,c:T.mut,a:'start',fw:800})
  return pcpSVG(VW,VH,s,T) }

// 8 · plano de corte das barras
function pcpSvgBarras(C,T){
  var E=C.est, bars=E.bars, VW=1600, padL=110, padR=40, rowH=34, VH=40+bars.length*rowH+20, k=(VW-padL-padR)/E.L, s=''
  bars.forEach(function(b,i){ var y=30+i*rowH, x=padL
    s+=pcpTxt(padL-12,y+19,'Barra '+(i+1),{fs:13,c:T.mut,a:'end',fw:700})
    s+='<rect x="'+padL+'" y="'+y+'" width="'+(E.L*k).toFixed(1)+'" height="24" fill="'+T.card+'" stroke="'+T.linha+'"/>'
    b.pecas.forEach(function(p){ var w=p.c*k; s+='<rect x="'+x.toFixed(1)+'" y="'+y+'" width="'+Math.max(1,w-1).toFixed(1)+'" height="24" fill="'+(p.t==='M'?T.metal:T.metalR)+'" stroke="'+T.metalE+'" stroke-width="0.6"/>'
      if(w>64) s+=pcpTxt(x+w/2,y+17,(p.t==='M'?'M ':'T ')+pcpM(p.c,3),{fs:12,c:'#fff'}); x+=w+E.kerf*k })
    if(b.sobra>0.005) s+=pcpTxt(padL+E.L*k-6,y+17,'sobra '+pcpM(b.sobra,2)+' m',{fs:11,c:T.mut,a:'end',fw:600}) })
  return pcpSVG(VW,VH,s,T) }

function pcpListaCorte(C){ var E=C.est, o={}
  E.pecas.forEach(function(p){ var k=p.rot+'|'+p.c; o[k]=o[k]||{rot:p.rot,c:p.c,q:0,t:p.t}; o[k].q++ })
  return Object.keys(o).map(function(k){ return o[k] }).sort(function(a,b){ return a.t===b.t?b.c-a.c:(a.t==='M'?-1:1) }) }
function pcpFaixaPortas(g){ return g.c0===g.c1?('coluna '+(g.c0+1)):('colunas '+(g.c0+1)+' a '+(g.c1+1)) }

function pcpWire(){
  var on=function(id,fn,ev){ var e=document.getElementById(id); if(e) e[ev||'onchange']=function(){ fn(e.value); } }
  var txt=function(id,k){ on(id,function(v){ PCP[k]=v },'oninput') }
  txt('pcp_nome','nome'); txt('pcp_cliente','cliente'); txt('pcp_local','local'); txt('pcp_projetista','projetista'); txt('pcp_rev','rev'); txt('pcp_obs','obs')
  on('pcp_data',function(v){ PCP.data=v })

// redesenha a tela mantendo o foco e o cursor no campo que está sendo digitado
function pcpRedesenha(id){ var el=document.getElementById(id), pos=null; try{ pos=el&&el.selectionStart }catch(e){}
  viewPCP(); Hist.commitLento()
  var n=document.getElementById(id); if(n&&n.tagName==='INPUT'){ n.focus(); try{ if(pos!=null) n.setSelectionRange(pos,pos) }catch(e){} } }

window.__crud=window.__crud||{}
__crud.pcpAba=function(a){ PCP.aba=a; var C=pcpCalc(PCP); var box=document.getElementById('pcp_prev'); if(box&&C&&!C.erro){ box.innerHTML=pcpPreview(C,pcpTema(PCP.pdf.tema)); var bs=document.querySelectorAll('.pcp-tabs button'); for(var i=0;i<bs.length;i++){ bs[i].className=(pcpTabs()[i][0]===a)?'on':'' } } else viewPCP() }
__crud.pcpNovoProj=function(){ if(PCP.nome&&!confirm('Começar um projeto CP novo? Salve na biblioteca antes, se quiser guardar este.')) return; P.pcp=pcpNovo(); PCP=P.pcp; Hist.commit(); viewPCP() }
__crud.pcpAbrir=function(id){ var p=pcpLib().filter(function(x){ return String(x.id)===String(id) })[0]; if(!p){ toast('Projeto não encontrado',false); return }
  var d=JSON.parse(JSON.stringify(p.dados||{})), b=pcpNovo(); var N=Object.assign(b,d); N.est=Object.assign(pcpNovo().est,d.est||{}); N.pdf=Object.assign(pcpNovo().pdf,d.pdf||{}); N.id=p.id; N.nome=p.nome||N.nome
  P.pcp=N; PCP=N; Hist.commit(); viewPCP(); toast('Projeto "'+(p.nome||'')+'" aberto') }
__crud.pcpExcluir=function(id){ var L=pcpLib(), p=L.filter(function(x){ return String(x.id)===String(id) })[0]; if(!p) return
  if(!confirm('Tirar o projeto CP "'+(p.nome||'')+'" da biblioteca?')) return
  L=L.filter(function(x){ return x!==p }); try{ localStorage.setItem('iledgrid_pcp',JSON.stringify(L)) }catch(e){}
  if(String(PCP.id)===String(id)) PCP.id=null; toast('Projeto tirado da biblioteca'); viewPCP() }
__crud.pcpSalvar=function(){
  if(!String(PCP.nome||'').trim()){ toast('Dê um nome ao projeto',false); var n=document.getElementById('pcp_nome'); if(n) n.focus(); return }
  var C=pcpCalc(PCP); if(!C||C.erro){ toast('Confira as medidas do painel',false); return }
  var dados=JSON.parse(JSON.stringify(PCP)); delete dados.id; delete dados.aba
  var L=pcpLib(), agora=new Date().toISOString(), ex=PCP.id?L.filter(function(x){ return String(x.id)===String(PCP.id) })[0]:null
  if(ex){ ex.nome=String(PCP.nome).trim(); ex.modelo=PCP.modelo; ex.dados=dados; ex.atualizado_em=agora }
  else { PCP.id=Date.now(); L.push({id:PCP.id,nome:String(PCP.nome).trim(),modelo:PCP.modelo,dados:dados,criado_em:agora,atualizado_em:agora}) }
  try{ localStorage.setItem('iledgrid_pcp',JSON.stringify(L)) }catch(e){ toast('Sem espaço no navegador — use SALVAR arquivo do projeto',false); return }
  Hist.commit(); toast('Projeto CP salvo na biblioteca (também vai junto no arquivo .iledgrid)'); viewPCP() }
